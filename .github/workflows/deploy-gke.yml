# Deploy do MyZap da JZ Tech no GKE.
#
# ⚠️ MANUAL DE PROPÓSITO (workflow_dispatch). Duas razões:
#
# 1. Atualizar a imagem aqui significa, em algum momento, apagar o pod — e apagar
#    o pod DESCONECTA as sessões de WhatsApp. Na VPS com pm2 essa lição já custou
#    caro: dois pushes em 10/06/2026 derrubaram uma sessão que precisou de QR novo.
# 2. O QR é presencial. Uma sessão derrubada por acidente não volta sozinha —
#    volta quando alguém estiver com o celular na mão.
#
# Por isso o StatefulSet usa `updateStrategy: OnDelete`: este workflow publica a
# imagem e atualiza o manifest, mas o pod só troca quando alguém rodar
# `kubectl -n myzap delete pod myzap-0`. Trocar de versão é uma decisão, não um
# efeito colateral de um commit.
#
# Variables/Secrets do repo (Settings → Secrets and variables → Actions):
#   var  GCP_PROJECT_ID                 = jztech-490722
#   var  GCP_WORKLOAD_IDENTITY_PROVIDER = projects/.../providers/...  (igual aos outros apps da frota)
#   var  GCP_SERVICE_ACCOUNT            = github-actions-prod@jztech-490722.iam.gserviceaccount.com
#
# NÃO há secret do GitHub aqui, e é deliberado: este repositório é PÚBLICO. O `TOKEN` do
# MyZap é chave-MESTRA do servidor, então ele vive só no cluster, no secret `myzap-secrets`
# criado à mão (ver o passo "Confere que o secret existe"). NUNCA use o valor de exemplo do
# `.envcopy` do upstream — é público.
name: Deploy MyZap to GKE

on:
  workflow_dispatch:
    inputs:
      reiniciar_pod:
        description: "Apagar o pod para subir a imagem nova? DERRUBA as sessões conectadas."
        type: boolean
        default: false

env:
  REGION: southamerica-east1
  REGISTRY: southamerica-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/jztech-docker-prod
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
  CLUSTER: jztech-gke-prod
  ZONE: southamerica-east1-a
  NS: myzap

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/myzap:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/myzap:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/myzap:cache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}

      - name: Namespace
        run: kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -

      # O secret `myzap-secrets` NÃO é criado aqui — ele é gerido À MÃO no cluster, e é
      # de propósito. Este repositório é PÚBLICO: uma GitHub Variable com o `TOKEN` seria a
      # chave-mestra do servidor (quem a tem administra e apaga TODAS as sessões) legível por
      # qualquer pessoa na internet, e nem os logs a mascarariam. Mantendo a credencial só no
      # cluster, ela não passa pelo GitHub em forma alguma — é o mesmo padrão do
      # `apizap-secrets` do JZ TECH ZAP.
      #
      #   kubectl -n myzap create secret generic myzap-secrets --from-env-file=myzap.env
      #
      # Chaves em docs/jztech/deploy-no-gke.md. As que fazem o motor falhar CALADO se
      # faltarem: TOKEN, CORS_ORIGIN, EMAIL e OPENAI_API_KEY.
      - name: Confere que o secret existe (o pod não sobe sem ele)
        run: |
          kubectl -n "$NS" get secret myzap-secrets >/dev/null 2>&1 || {
            echo "::error::Secret 'myzap-secrets' não existe no namespace $NS."
            echo "Crie-o no cluster (ele NÃO vem do GitHub — ver comentário acima):"
            echo "  kubectl -n $NS create secret generic myzap-secrets --from-env-file=myzap.env"
            exit 1
          }
          echo ">>> myzap-secrets encontrado."

      - name: Aplica manifests
        run: |
          sed -e "s|__REGISTRY__|${REGISTRY}|g" -e "s|__TAG__|${IMAGE_TAG}|g" k8s/myzap.yaml | kubectl apply -f -

      - name: Trocar a imagem do pod (só se pedirem)
        if: ${{ inputs.reiniciar_pod }}
        run: |
          # Todas as réplicas: desde o shard (23/09/2026) cada pod é um motor com
          # os seus números, e todos precisam da imagem nova.
          REPLICAS=$(kubectl -n "$NS" get statefulset myzap -o jsonpath='{.spec.replicas}')
          for i in $(seq 0 $((REPLICAS - 1))); do
            # --wait=true (default) para o pod SUMIR antes de esperar o novo: com
            # --wait=false o passo seguinte corria e batia em "pods myzap-0 not
            # found", porque o StatefulSet ainda não tinha recriado.
            kubectl -n "$NS" delete pod "myzap-$i" --ignore-not-found

            # E o pod tem de EXISTIR antes de `wait --for=condition=Ready` — o wait
            # falha na hora se o objeto não existe, em vez de esperar por ele.
            for _ in $(seq 1 60); do
              kubectl -n "$NS" get pod "myzap-$i" >/dev/null 2>&1 && break
              sleep 5
            done

            # `rollout status` NÃO funciona com updateStrategy OnDelete ("rollout
            # status is only available for RollingUpdate strategy type") — espera-se
            # o pod, que é o que interessa. Um de cada vez: o outro motor segue no ar.
            kubectl -n "$NS" wait --for=condition=Ready "pod/myzap-$i" --timeout=600s
          done

      - name: Estado
        run: |
          kubectl -n "$NS" get statefulset,pod,pvc,svc -o wide
          echo
          echo "Imagem publicada: ${REGISTRY}/myzap:${IMAGE_TAG}"
          if [ "${{ inputs.reiniciar_pod }}" != "true" ]; then
            echo "Os pods NÃO foram trocados (OnDelete). Para subir esta imagem:"
            echo "  kubectl -n $NS delete pod myzap-0 myzap-1    # derruba as sessões conectadas"
          fi
