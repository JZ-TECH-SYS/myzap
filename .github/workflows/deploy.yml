name: Deploy MyZap na VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22022
        script: |
          set -e
          cd /var/www/myzap
          if [ -d .git ]; then
            # Força estado exatamente igual ao remoto (descarta modificações locais e arquivos não rastreados)
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd
          else
            echo "[ERRO] /var/www/myzap não é um repositório git. Inicialize ou clone antes." >&2
            exit 1
          fi
            echo "[INFO] Instalando dependências Node..."
            if command -v npm >/dev/null 2>&1; then
              echo "Node: $(node -v) / NPM: $(npm -v)"
            else
              echo "[ERRO] npm não encontrado no PATH. Instale Node.js na VPS." >&2
              exit 1
            fi

            # Instalação determinística se existir package-lock.json
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --production
            fi

            # (Opcional) Atualizar dependências para últimas versões compatíveis se variável setada
            if [ "${NPM_UPDATE:-0}" = "1" ]; then
              echo "[INFO] Executando npm update (--omit=dev)";
              npm update --omit=dev || true
            fi

            # Remove pacotes sobrando conforme package.json
            npm prune --omit=dev

            echo "[INFO] Reiniciando aplicação via PM2"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload myzap || pm2 restart myzap || pm2 start index.js --name myzap
              pm2 save || true
            else
              echo "[ERRO] pm2 não encontrado. Instale com: npm install -g pm2" >&2
              exit 1
            fi
