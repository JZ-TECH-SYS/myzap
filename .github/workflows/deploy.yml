name: Deploy MyZap na VPS

# DEPLOY MANUAL (workflow_dispatch): o deploy reinicia o pm2 e DERRUBA as
# sessoes de WhatsApp conectadas em producao. Com gatilho automatico no push,
# qualquer commit (ate um fix trivial) desconectava clientes sem aviso —
# caso real em 10/06/2026: 2 pushes derrubaram a sessao vaqueiropizzaria2,
# que precisou re-escanear o QR. Agora: Actions -> Deploy MyZap na VPS -> Run.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Trava de segurança: se o fluxo da IA não atravessa de ponta a ponta,
      # o deploy nem conecta na VPS (o smoke roda com Node puro, sem install).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke IA (bloqueia deploy quebrado)
        run: node test/smoke-ia.js

      - name: Deploy via SSH
        # Recomendo usar pelo menos a última patch da v1.x
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Agente IA (atendente do WhatsApp) — Variables/Secrets do repositório
          IA_PROVIDER: ${{ vars.IA_PROVIDER }}
          AGENT_URL: ${{ vars.AGENT_URL }}
          AGENT_AUTH_TOKEN: ${{ secrets.AGENT_AUTH_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22022
          timeout: 2m            # tempo para CONECTAR via SSH (default 30s)
          command_timeout: 40m   # tempo para rodar os comandos (default 10m)
          # Se você quiser controlar updates (pnpm update) pelo Actions:
          envs: PNPM_UPDATE,IA_PROVIDER,AGENT_URL,AGENT_AUTH_TOKEN
          script: |
            set -e

            cd /var/www/myzap
            if [ -d .git ]; then
              git fetch --prune origin main
              git reset --hard origin/main
              git clean -fd
            else
              echo "[ERRO] /var/www/myzap não é um repositório git. Inicialize ou clone antes." >&2
              exit 1
            fi

            echo "[INFO] Instalando dependências Node com pnpm..."
            if ! command -v pnpm >/dev/null 2>&1; then
              echo "[INFO] pnpm não encontrado. Instalando via corepack..."
              corepack enable
              corepack prepare pnpm@latest --activate
            fi
            echo "Node: $(node -v) / pnpm: $(pnpm -v)"

            # ✅ LIMPEZA FORÇADA - Remove node_modules e cache corrompidos
            echo "[INFO] Limpando instalação anterior..."
            rm -rf node_modules
            pnpm store prune

            # Se já existir lockfile, instalação determinística
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install
            fi

            # (Opcional) atualizar compatíveis se PNPM_UPDATE=1
            if [ "${PNPM_UPDATE:-0}" = "1" ]; then
              echo "[INFO] Executando pnpm update"
              pnpm update || true
            fi

            pnpm prune

            # ── Envs do Agente IA (vindas das Variables/Secrets do Actions) ──
            # Upsert no .env da VPS: o painel do ClickExpress liga/desliga por
            # empresa; estas envs só apontam o myzap para o serviço do agente.
            # Deixar AGENT_URL vazio nas Variables desativa a gravação (rollback
            # = apagar IA_PROVIDER da Variable e rodar o deploy).
            touch .env
            for KV in "IA_PROVIDER=${IA_PROVIDER}" "AGENT_URL=${AGENT_URL}" "AGENT_AUTH_TOKEN=${AGENT_AUTH_TOKEN}"; do
              K="${KV%%=*}"; V="${KV#*=}"
              if [ -z "$V" ]; then continue; fi
              if grep -q "^${K}=" .env; then
                sed -i "s|^${K}=.*|${K}=${V}|" .env
              else
                printf '%s\n' "$KV" >> .env
              fi
              echo "[INFO] .env: ${K} configurado"
            done

            echo "[INFO] Reiniciando aplicação via PM2"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload myzap || pm2 restart myzap || pm2 start index.js --name myzap
              pm2 save || true
            else
              echo "[ERRO] pm2 não encontrado. Instale com: npm install -g pm2" >&2
              exit 1
            fi
