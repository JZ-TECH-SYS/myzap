name: Deploy MyZap na VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via SSH
        # Recomendo usar pelo menos a última patch da v1.x
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22022
          timeout: 2m            # tempo para CONECTAR via SSH (default 30s)
          command_timeout: 40m   # tempo para rodar os comandos (default 10m)
          # Se você quiser controlar updates (npm update) pelo Actions:
          envs: NPM_UPDATE
          script: |
            set -e

            cd /var/www/myzap
            if [ -d .git ]; then
              git fetch --prune origin main
              git reset --hard origin/main
              git clean -fd
            else
              echo "[ERRO] /var/www/myzap não é um repositório git. Inicialize ou clone antes." >&2
              exit 1
            fi

            echo "[INFO] Instalando dependências Node..."
            if ! command -v npm >/dev/null 2>&1; then
              echo "[ERRO] npm não encontrado no PATH. Instale Node.js na VPS." >&2
              exit 1
            fi
            echo "Node: $(node -v) / NPM: $(npm -v)"

            # ✅ LIMPEZA FORÇADA - Remove node_modules e cache corrompidos
            echo "[INFO] Limpando instalação anterior..."
            rm -rf node_modules
            npm cache clean --force

            # acelera e evita ruído
            npm config set fund false
            npm config set audit false
            npm config set progress false

            # Se já existir lockfile, instalação determinística
            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi

            # (Opcional) atualizar compatíveis se NPM_UPDATE=1
            if [ "${NPM_UPDATE:-0}" = "1" ]; then
              echo "[INFO] Executando npm update"
              npm update || true
            fi

            npm prune

            echo "[INFO] Reiniciando aplicação via PM2"
            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload myzap || pm2 restart myzap || pm2 start index.js --name myzap
              pm2 save || true
            else
              echo "[ERRO] pm2 não encontrado. Instale com: npm install -g pm2" >&2
              exit 1
            fi
