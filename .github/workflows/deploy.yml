name: Deploy MyZap na VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22022
        script: |
          set -e
          cd /var/www/myzap
          if [ -d .git ]; then
            # Força estado exatamente igual ao remoto (descarta modificações locais e arquivos não rastreados)
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd
          else
            echo "[ERRO] /var/www/myzap não é um repositório git. Inicialize ou clone antes." >&2
            exit 1
          fi
          pm2 restart myzap
